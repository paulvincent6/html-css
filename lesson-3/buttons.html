<style>
  button {  
    height: 36px;
    width: 105px;
    cursor: pointer;
  }

  .subscribe-btn {
    background-color: rgb(200, 0, 0);
    border: none;
    border-radius: 4px;
    color: white;
    transition: opacity 0.15s;
  }

  .subscribe-btn:hover {
    opacity: 0.8;
  }

  .subscribe-btn:active {
    opacity: 0.5;
  }

  .join-btn {
    background-color: rgb(255, 255, 255);
    border: 1px solid rgb(41, 100, 200);
    border-radius: 4px;
    color: rgb(41, 100, 200);
    transition: opacity 0.15s;
  }

  .join-btn:hover {
    background-color: rgb(41, 100, 200);
    color: white;
  }

  .join-btn:active {
    opacity: 0.7;
  }

  .tweet-btn {
    background-color: rgb(0, 200, 200);
    border: none;
    border-radius: 18px;
    color: white;
    font-weight: bold;
    font-size: 16px;
    width: 85px;
    margin-left: 8px;
    transition: opacity 0.15s;
  }

  .tweet-btn:hover {
    opacity: 0.8;
  }

  .tweet-btn:active {
    opacity: 0.5;
  }



</style>


<button class="subscribe-btn">
  Subscribe
</button>

<button class="join-btn">
  Join
</button>

<button class="tweet-btn">
  Tweet
</button>
